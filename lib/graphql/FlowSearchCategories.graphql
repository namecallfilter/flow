query FlowSearchCategories($query: String!, $first: Int, $after: Cursor) {
  searchCategories(query: $query, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        displayName
        boxArtURL
        viewersCount
      }
    }
    pageInfo {
      hasNextPage
    }
  }
}
