query FlowChatAssets($login: String!) {
  badges { setID version title imageURL(size: DOUBLE) }
  emoteSet(id: "0") { emotes { id token } }
  user(login: $login) {
    id
    broadcastBadges { setID version title imageURL(size: DOUBLE) }
    subscriptionProducts { emotes { id token } }
    channel { localEmoteSets { emotes { id token } } }
  }
}
