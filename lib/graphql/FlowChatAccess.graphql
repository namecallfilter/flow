query FlowChatAccess($login: String!) {
  user(login: $login) {
    id
    login
    displayName
    chatSettings { rules }
    self {
      follower { followedAt }
      isModerator
      isVIP
      chatRestrictedReasons
      lastRecentChatMessageAt
      banStatus { isPermanent expiresAt }
    }
  }
}
